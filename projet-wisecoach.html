  <meta charset="UTF-8">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #080808; --gold: #D4AF37; --border: #222;
      --cream: #F0EDE6; --muted: #666; --text: #E8E4DC;
      --serif: 'Cormorant Garamond', serif;
      --sans: 'DM Sans', sans-serif;
    }
    body {
      background: var(--black);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
    }
    .back-link {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      z-index: 100;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      padding: 0.6rem 1.2rem;
      border-radius: 2px;
      text-decoration: none;
      color: var(--gold);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid rgba(212,175,55,0.3);
      transition: all 0.3s;
    }
    @media (min-width: 768px) {
      .back-link { top: 2rem; left: 2rem; padding: 0.8rem 1.5rem; font-size: 0.75rem; }
    }
    .back-link:hover { border-color: var(--gold); background: rgba(212,175,55,0.1); }
    .project-container { max-width: 1200px; margin: 0 auto; padding: 6rem 1.5rem 4rem; }
    @media (min-width: 768px) { .project-container { padding: 8rem 2rem 5rem; } }
    .project-title {
      font-family: var(--serif);
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 300;
      color: var(--cream);
      margin-bottom: 0.5rem;
    }
    .project-subtitle {
      color: var(--gold);
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }
    .project-media {
      margin: 2rem 0;
      border-radius: 8px;
      overflow: hidden;
      background: #0a0a0a;
    }
    .project-media video, .project-media img {
      width: 100%;
      display: block;
    }
    .project-description {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.8;
      max-width: 800px;
      margin: 2rem auto 0;
    }
    .btn-back {
      display: inline-block;
      margin-top: 2rem;
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid var(--gold);
      padding-bottom: 0.2rem;
    }
    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid var(--border);
      margin-top: 4rem;
      color: #444;
      font-size: 0.7rem;
    }
  </style>
</head>
<body>
<a href="index.html" class="back-link">← Retour au portfolio</a>
<div class="project-container">
  <h1 class="project-title">WiseCoach App</h1>
  <div class="project-subtitle">React Native · UI premium</div>
  <div class="project-media">
    <video controls style="width:100%">
      <source src="manemaykane2.mp4" type="video/mp4">
    </video>
  </div>
  <div class="project-description">
    <p>Application mobile de coaching sportif. Design UI/UX premium, animations fluides et expérience utilisateur intuitive.</p>
  </div>

</div>
<footer>
